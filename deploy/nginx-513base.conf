location = /513base {
    return 301 /513base/$is_args$args;
}

location = /513base/index.html {
    add_header Cache-Control "no-store" always;
}

location ~ ^/513base/assets/[^/]+\.(js|css)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ~ ^/513base/data/.*\.(jpg|jpeg|png|webp)$ {
    try_files $uri =404;
    expires 1d;
}

location /513base/ {
    try_files $uri $uri/ /513base/index.html;
    add_header Cache-Control "no-store" always;
}
